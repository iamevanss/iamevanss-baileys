name: Verify @iamvanss/baileys

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Validate JavaScript
        run: |
          node --check lib/index.js
          node --check lib/Socket/index.js
          node --check lib/Features/channel-force-join.js
          node --check lib/Features/pairing.js
          node --check lib/branding.js
          node --check lib/Signal/lid-mapping.js
          node --check lib/Utils/jid-resolver.js
          node --check lib/Utils/terminal.js
          node --check lib/Utils/use-sqlite-auth-state.js
          node --check lib/Store/make-cache-manager-store.js

      - name: Runtime smoke tests
        run: |
          node tests/smoke.mjs
          node tests/auth-state.mjs
          node tests/lid-resolver.mjs
          node tests/terminal.mjs

      - name: Validate package contents
        run: npm pack --dry-run --ignore-scripts
