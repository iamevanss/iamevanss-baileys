name: Build @iamvanss/baileys

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[baileys-bootstrap]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch selected Baileys implementations
        run: |
          git clone --depth 1 https://github.com/XazepysK/wbails.git /tmp/wbails
          git clone --depth 1 https://github.com/vanSnowi/baileys.git /tmp/vansnowi

      - name: Populate functional Baileys base
        run: |
          rm -rf lib WAProto engine-requirements.js
          cp -R /tmp/wbails/lib ./lib
          cp -R /tmp/wbails/WAProto ./WAProto
          cp /tmp/wbails/engine-requirements.js ./engine-requirements.js

      - name: Add storage and SQL-auth improvements
        run: |
          cp /tmp/vansnowi/lib/Store/make-cache-manager-store.js lib/Store/make-cache-manager-store.js
          cp /tmp/vansnowi/lib/Utils/use-sqlite-auth-state.js lib/Utils/use-sqlite-auth-state.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/Store/index.js')
          text = p.read_text()
          if "./make-cache-manager-store.js" not in text:
              text += "\nexport * from './make-cache-manager-store.js';\nexport { default as makeCacheManagerStore } from './make-cache-manager-store.js';\n"
          p.write_text(text)
          p = Path('lib/Utils/index.js')
          text = p.read_text()
          if "./use-sqlite-auth-state.js" not in text:
              text += "\nexport * from './use-sqlite-auth-state.js';\n"
          p.write_text(text)
          PY

      - name: Add optional channel force-join and pairing APIs
        run: |
          mkdir -p lib/Features
          cat > lib/Features/channel-force-join.js <<'EOF'
          export const CHANNEL_FORCE_JOIN_CONFIG = Object.freeze({ enabled: false, url: null })
          export const isChannelForceJoinConfigured = () => CHANNEL_FORCE_JOIN_CONFIG.enabled === true && typeof CHANNEL_FORCE_JOIN_CONFIG.url === 'string' && CHANNEL_FORCE_JOIN_CONFIG.url.length > 0
          export const getChannelForceJoinConfig = () => ({ ...CHANNEL_FORCE_JOIN_CONFIG })
          EOF
          cat > lib/Features/pairing.js <<'EOF'
          import { randomBytes } from 'crypto'

          const CROCKFORD_CHARACTERS = '123456789ABCDEFGHJKLMNPQRSTVWXYZ'
          const PAIRING_CODE_SIZE = 8

          export const PAIRING_CODE_ALPHABET = CROCKFORD_CHARACTERS
          export const PAIRING_CODE_LENGTH = PAIRING_CODE_SIZE

          export const isValidPairingCode = (code) => {
            return typeof code === 'string'
              && code.length === PAIRING_CODE_SIZE
              && /^[123456789ABCDEFGHJKLMNPQRSTVWXYZ]+$/.test(code.toUpperCase())
          }

          export const normalizePairingCode = (code) => {
            if (typeof code !== 'string') {
              throw new TypeError('Pairing code must be a string')
            }
            const normalized = code.trim().toUpperCase()
            if (!isValidPairingCode(normalized)) {
              throw new Error(`Pairing code must be exactly ${PAIRING_CODE_SIZE} characters using the Crockford alphabet`)
            }
            return normalized
          }

          export const generatePairingCode = () => {
            let value = 0
            let bitCount = 0
            let code = ''
            for (const byte of randomBytes(5)) {
              value = (value << 8) | byte
              bitCount += 8
              while (bitCount >= 5 && code.length < PAIRING_CODE_SIZE) {
                code += CROCKFORD_CHARACTERS[(value >>> (bitCount - 5)) & 31]
                bitCount -= 5
              }
            }
            return code
          }
          EOF
          cat > lib/Features/index.js <<'EOF'
          export * from './channel-force-join.js'
          export * from './pairing.js'
          EOF

      - name: Install terminal branding
        run: |
          cat > lib/branding.js <<'EOF'
          const BOLD = '\x1b[1m'
          const RESET = '\x1b[0m'
          export const BAILEYS_BANNER = `${BOLD}ㅤ༺ㅤꜱᴛᴀɪɴㅤ༻ㅤ${RESET}`
          export const printBaileysBanner = () => console.log(BAILEYS_BANNER)
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/index.js')
          original = p.read_text().replace('import chalk from "chalk";\n', '')
          marker = "export * from '../WAProto/index.js';"
          if marker not in original:
              raise SystemExit('Unexpected Baileys index layout')
          start = original.find('console.log(chalk')
          if start >= 0:
              end = original.find(marker, start)
              if end < 0:
                  raise SystemExit('Unable to remove existing banner')
              original = original[:start] + original[end:]
          prefix = "import { printBaileysBanner } from './branding.js';\nprintBaileysBanner();\n"
          if not original.startswith("import { printBaileysBanner }"):
              original = prefix + original
          export_line = "export * from './Features/index.js';"
          if export_line not in original:
              original = original.replace("export * from './Utils/index.js';", "export * from './Utils/index.js';\n" + export_line)
          p.write_text(original)
          PY

      - name: Record upstream notices
        run: |
          mkdir -p THIRD_PARTY_NOTICES
          cp /tmp/wbails/LICENSE THIRD_PARTY_NOTICES/WBAILS-MIT.txt
          cp /tmp/vansnowi/LICENSE THIRD_PARTY_NOTICES/VANSNOWI-MIT.txt

      - name: Validate generated source
        run: |
          node -e "const p=require('./package.json'); if(p.name!=='@iamvanss/baileys') process.exit(1); console.log(p.name, p.version)"
          node --check lib/index.js
          node --check lib/Features/channel-force-join.js
          node --check lib/Features/pairing.js
          node --check lib/branding.js

      - name: Commit generated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib WAProto engine-requirements.js THIRD_PARTY_NOTICES
          git commit -m 'feat: bootstrap @iamvanss/baileys [baileys-bootstrap]' || exit 0
          git push

  verify:
    if: always()
    needs: bootstrap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Runtime smoke test
        run: node tests/smoke.mjs
